name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Redis contract tests run in Docker via Testcontainers)
        run: mvn -B verify

  load:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start 2 app instances, Redis, PostgreSQL and nginx
        run: |
          docker compose up --build -d --wait
          for i in $(seq 60); do curl -sf localhost:8080/events/drop-2026/stats && break; sleep 2; done
      - name: Load test with 10% injected payment declines
        run: |
          docker run --rm --network host -v "$PWD/load:/load" grafana/k6:0.54.0 \
            run -e BUYERS=600 -e DECLINE=0.1 /load/drop.js
      - name: App logs
        if: failure()
        run: docker compose logs app1 app2 | tail -200
      - name: Stop
        if: always()
        run: docker compose down -v
