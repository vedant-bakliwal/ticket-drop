upstream ticket_drop {
    server app1:8080 max_fails=0;
    server app2:8080 max_fails=0;
    keepalive 64;
}

server {
    listen 80;
    location / {
        proxy_pass http://ticket_drop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
